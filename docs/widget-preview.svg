<svg viewBox="0 0 400 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .panel { fill: #0e1117; stroke: #262d38; stroke-width: 1; }
      .panel-raised { fill: #161b23; }
      .text-primary { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #e8edf5; }
      .text-secondary { font-size: 12px; fill: #96a2b4; }
      .text-faint { font-size: 11px; fill: #5d6877; }
      .text-label { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; fill: #e8edf5; text-transform: uppercase; }
      .dot-codex { fill: #4ade80; }
      .dot-claude { fill: #f59e6a; }
      .progress-bg { fill: rgba(255, 255, 255, 0.05); stroke: #262d38; stroke-width: 1; }
      .progress-fill-codex { fill: #4ade80; }
      .progress-fill-claude { fill: #f59e6a; }
    </style>
  </defs>

  <!-- Main panel -->
  <rect class="panel" x="20" y="20" width="360" height="440" rx="14"/>

  <!-- Header -->
  <rect class="panel-raised" x="20" y="20" width="360" height="50" rx="14" ry="0"/>
  <line x1="20" y1="70" x2="380" y2="70" stroke="#262d38" stroke-width="1"/>

  <!-- Header text -->
  <text x="30" y="50" class="text-primary">AI Usage</text>

  <!-- Header icons -->
  <circle cx="350" cy="45" r="10" fill="none" stroke="#262d38" stroke-width="1"/>
  <text x="347" y="48" class="text-faint">⟳</text>

  <circle cx="370" cy="45" r="10" fill="none" stroke="#262d38" stroke-width="1"/>
  <text x="367" y="48" class="text-faint">⚙</text>

  <!-- Codex Card -->
  <rect class="panel-raised" x="30" y="90" width="340" height="130" rx="12"/>

  <!-- Codex header -->
  <circle class="dot-codex" cx="40" cy="105" r="3"/>
  <text x="50" y="110" class="text-label">Codex</text>
  <text x="280" y="110" class="text-faint">11s ago</text>

  <!-- Codex 5h row -->
  <text x="40" y="135" class="text-secondary">5h</text>
  <text x="290" y="135" class="text-secondary">72% left</text>

  <rect class="progress-bg" x="40" y="140" width="260" height="6" rx="3"/>
  <rect class="progress-fill-codex" x="40" y="140" width="187" height="6" rx="3"/>

  <text x="40" y="160" class="text-faint">Resets in 2h 14m</text>

  <!-- Codex weekly row -->
  <text x="40" y="190" class="text-secondary">Weekly</text>
  <text x="290" y="190" class="text-secondary">41% left</text>

  <rect class="progress-bg" x="40" y="195" width="260" height="6" rx="3"/>
  <rect class="progress-fill-codex" x="40" y="195" width="106.6" height="6" rx="3"/>

  <text x="40" y="215" class="text-faint">Thursday 09:30</text>

  <!-- Claude Card -->
  <rect class="panel-raised" x="30" y="230" width="340" height="130" rx="12"/>

  <!-- Claude header -->
  <circle class="dot-claude" cx="40" cy="245" r="3"/>
  <text x="50" y="250" class="text-label">Claude</text>
  <text x="280" y="250" class="text-faint">12m ago</text>

  <!-- Claude 5h row -->
  <text x="40" y="275" class="text-secondary">5h</text>
  <text x="290" y="275" class="text-secondary">54% left</text>

  <rect class="progress-bg" x="40" y="280" width="260" height="6" rx="3"/>
  <rect class="progress-fill-claude" x="40" y="280" width="140.4" height="6" rx="3"/>

  <text x="40" y="300" class="text-faint">Resets in 1h 03m</text>

  <!-- Claude weekly row -->
  <text x="40" y="330" class="text-secondary">Weekly</text>
  <text x="290" y="330" class="text-secondary">68% left</text>

  <rect class="progress-bg" x="40" y="335" width="260" height="6" rx="3"/>
  <rect class="progress-fill-claude" x="40" y="335" width="176.8" height="6" rx="3"/>

  <text x="40" y="355" class="text-faint">Sunday 18:00</text>

  <!-- Footer -->
  <line x1="20" y1="380" x2="380" y2="380" stroke="#262d38" stroke-width="1"/>
  <text x="30" y="405" class="text-faint">Updated just now</text>
  <text x="310" y="405" class="text-faint">Esc to close</text>
</svg>