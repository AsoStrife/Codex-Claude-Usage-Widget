[package]
name = "ai-usage-widget"
version = "0.1.0"
description = "Windows 11 tray widget for monitoring Codex and Claude Code subscription usage"
authors = ["Andrea Corriga"]
edition = "2021"
rust-version = "1.60"
publish = false

[build-dependencies]
tauri-build = { version = "2.9", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.9", features = [] }
tauri-plugin-autostart = "2.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
