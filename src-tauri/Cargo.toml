[package]
name = "ai-usage-widget"
version = "0.1.0"
description = "Windows 11 tray widget for monitoring Codex and Claude Code subscription usage"
authors = ["Andrea Corriga"]
edition = "2021"
rust-version = "1.77"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["process", "io-util", "rt", "macros", "sync", "time"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
